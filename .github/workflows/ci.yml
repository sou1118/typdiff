name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            command: cargo fmt --check
            cache: false
          - name: Clippy
            command: cargo clippy -- -D warnings
            cache: true
          - name: Test
            command: cargo test
            cache: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ matrix.cache }}
      - run: ${{ matrix.command }}

  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: actionlint zizmor aqua:oxc-project/oxc/oxfmt
      - name: actionlint
        run: actionlint
      - name: zizmor
        run: zizmor .github/workflows/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: oxfmt
        run: oxfmt --check .

  compile-test:
    name: Compile Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build typdiff
        run: cargo build
      - name: Diff and compile (basic fixtures)
        run: |
          cargo run -- tests/fixtures/old.typ tests/fixtures/new.typ -o /tmp/diff-basic.typ
          typst compile /tmp/diff-basic.typ /tmp/diff-basic.pdf
      - name: Diff and compile (rich fixtures)
        run: |
          cargo run -- tests/fixtures/rich-old.typ tests/fixtures/rich-new.typ -o /tmp/diff-rich.typ
          typst compile /tmp/diff-rich.typ /tmp/diff-rich.pdf
