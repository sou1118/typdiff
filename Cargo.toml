[workspace]
members = ["bindings/python"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"

[package]
name = "typdiff"
version.workspace = true
authors = ["@sou1118"]
edition.workspace = true
description = "A diff tool for Typst documents, similar to latexdiff"
repository = "https://github.com/sou1118/typdiff"
license.workspace = true
readme = "README.md"

[[bin]]
name = "typdiff"
path = "src/main.rs"

[dependencies]
typst-syntax = "0.14"
similar = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
pretty_assertions = "1"
